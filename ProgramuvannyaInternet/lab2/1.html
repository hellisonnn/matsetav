<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1</title>
</head>
<body onload="clock()">
    <a style="display: block; text-align: right;" href="lab2.html">Назад</a>

    <h2>Завдання 1: Динамічний годинник (Варіант 3)</h2>
    <p>Формат: <b>year#month#day-hour#min#sec</b></p>
    
    <div id="dateTimeDisplay" style="font-size: 24px; font-weight: bold; margin-top: 10px;"></div>

    <script type="text/javascript">
        function clock() {
            let now = new Date(); 

            let year = now.getFullYear();
            let month = now.getMonth() + 1;
            let day = now.getDate();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            month = (month < 10) ? "0" + month : month;
            day = (day < 10) ? "0" + day : day;
            hours = (hours < 10) ? "0" + hours : hours;
            minutes = (minutes < 10) ? "0" + minutes : minutes;
            seconds = (seconds < 10) ? "0" + seconds : seconds;

            let dateTimeStr = year + "." + month + "." + day + "<br>" + hours + ":" + minutes + ":" + seconds;

            document.getElementById("dateTimeDisplay").innerHTML = dateTimeStr;

            setTimeout("clock()", 1000);
        }
    </script>
</body>
</html>
