    <h2>Завдання 4: Дослідження методу console.log()</h2>
    <p>Щоб побачити результати, відкрийте панель DevTools: натисніть <b>F12</b> або клікніть правою кнопкою миші на сторінці, оберіть <b>«Перевірити»</b> і перейдіть на вкладку <b>Console</b>.</p>

    <script type="text/javascript">
        let num1 = 17;
        let num2 = 5;
        console.log("Остача від ділення 17 на 5 дорівнює:", num1 % num2);

        let num3 = 20;
        let num4 = 4;
        let isEven = (num3 % num4 === 0); 
        console.log("Чи ділиться 20 на 4 без остачі? Результат:", isEven); 

        let arr = [10, 20, "Успіх"];
        console.log("Значення масиву: перше число %d, друге число %d. Статус: %s", arr[0], arr[1], arr[2]);
    </script>
