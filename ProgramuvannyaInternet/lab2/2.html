<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 2</title>
    <style>
        .calculator {
            width: 250px;
            margin: 20px;
            padding: 15px;
            border: 2px solid #333;
            border-radius: 8px;
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
        }
        #display {
            width: 100%;
            height: 40px;
            font-size: 20px;
            text-align: right;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        button {
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button:hover {
            background-color: #e0e0e0;
        }
        .operator {
            background-color: #f0a500;
            color: white;
            border: none;
        }
        .operator:hover {
            background-color: #d18d00;
        }
        .clear {
            grid-column: span 3;
            background-color: #d9534f;
            color: white;
            border: none;
        }
        .clear:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>
    <a style="display: block; text-align: right;" href="lab2.html">Назад</a>

    <h2>Завдання 2: Простий калькулятор</h2>

    <div class="calculator">
        <input type="text" id="display" readonly>
        
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendSymbol('/')">/</button>
            
            <button onclick="appendSymbol('7')">7</button>
            <button onclick="appendSymbol('8')">8</button>
            <button onclick="appendSymbol('9')">9</button>
            <button class="operator" onclick="appendSymbol('*')">*</button>
            
            <button onclick="appendSymbol('4')">4</button>
            <button onclick="appendSymbol('5')">5</button>
            <button onclick="appendSymbol('6')">6</button>
            <button class="operator" onclick="appendSymbol('-')">-</button>
            
            <button onclick="appendSymbol('1')">1</button>
            <button onclick="appendSymbol('2')">2</button>
            <button onclick="appendSymbol('3')">3</button>
            <button class="operator" onclick="appendSymbol('+')">+</button>
            
            <button onclick="appendSymbol('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendSymbol('.')">.</button>
            <button class="operator" onclick="calculateResult()">=</button>
        </div>
    </div>

    <script type="text/javascript">
        let display = document.getElementById("display");

        function appendSymbol(symbol) {
            display.value += symbol;
        }

        function clearDisplay() {
            display.value = "";
        }

        function calculateResult() {
            try {
                display.value = eval(display.value);
            } catch (error) {
                display.value = "Помилка";
            }
        }
    </script>

</body>
</html>
