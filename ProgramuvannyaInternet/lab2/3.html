<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 3</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; margin-top: 15px; }
        td { padding: 5px; }
        input[type="text"] { width: 60px; text-align: center; padding: 5px; }
        input[type="button"] { padding: 5px 10px; margin-top: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <a style="display: block; text-align: right;" href="lab2.html">Назад</a>
    <h2>Завдання 3 (Варіант 3)</h2>
    
    <form id="main_form">
        <table>
            <tr>
                <td>Кількість рядків</td>
                <td><input type="text" id="t_str" value="5"></td>
            </tr>
            <tr>
                <td>Кількість стовпців</td>
                <td><input type="text" id="t_stb" value="5"></td>
            </tr>
            <tr>
                <td colspan="2"><input type="button" onclick="fun();" value="Побудувати матрицю"></td>
            </tr>
            <tr>
                <td colspan="2"><input type="button" onclick="fun_build();" value="Розрахувати"></td>
            </tr>
        </table>
        
        <div id="main_div"></div>
    </form>

    <script type="text/javascript">
        let str, stb;

        function fun() {
            str = parseInt(document.getElementById("t_str").value);
            stb = parseInt(document.getElementById("t_stb").value);
            
            let res_str = "<table>\n";
            
            for(let i = 1; i <= str; i++) {
                res_str += "<tr>\n";
                
                for(let j = 1; j <= stb; j++) {
                    let cellValue = 11 * i + j;
                    
                    res_str += "<td>";
                    res_str += "<input type='text' id='_" + i + "_" + j + "' value='" + cellValue + "'>";
                    res_str += "</td>\n";
                }
                res_str += "</tr>\n";
            }
            res_str += "</table>";
            
            document.getElementById("main_div").innerHTML = res_str;
        }

        function fun_build() {
            str = parseInt(document.getElementById("t_str").value);
            stb = parseInt(document.getElementById("t_stb").value);
            
            if (stb < 3) {
                alert("У матриці менше 3 стовпців. Неможливо підрахувати суму третього стовпця!");
                return;
            }
            
            let sum = 0;
            let j = 3;

            for(let i = 1; i <= str; i++) {
                let currentInput = document.getElementById("_" + i + "_" + j);
                sum += parseInt(currentInput.value);
            }
            
            alert("Сума елементів третього стовпця = " + sum);
        }
    </script>

</body>
</html>
