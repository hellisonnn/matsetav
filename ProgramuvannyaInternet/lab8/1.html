<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 8 - Анімація</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9ecef;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            margin: 0;
            position: relative;
            min-height: 100vh;
        }

        #animationArea {
            position: relative;
            width: 700px;
            height: 450px;
            background-color: #ffffff;
            border: 3px solid #6c757d;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #logoText {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            font-size: 32px;
            font-weight: bold;
            color: #212529;
            z-index: 10;
            pointer-events: none;
            text-shadow: 2px 2px 5px rgba(255, 255, 255, 0.9), 
                        -2px -2px 5px rgba(255, 255, 255, 0.9),
                         0px 0px 10px rgba(255, 255, 255, 1);
        }

        #movingBox {
            position: absolute;
            top: 100px;
            left: 100px;
            width: 50px;
            height: 50px;
            background-color: #0d6efd;
            transition: background-color 0.3s, border-radius 0.3s;
        }

        .extra-element {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #dc3545;
            border-radius: 50%;
            display: none;
            z-index: 5;
        }

        .hint {
            margin-bottom: 10px;
            font-weight: bold;
            color: #495057;
        }
    </style>
</head>
<body>
    <a href="lab8.html" style="position: absolute; top: 20px; right: 30px; color: blue; text-decoration: underline; font-size: 16px;">Назад</a>

    <div class="hint">Клікніть на білу область, щоб запустити або зупинити анімацію</div>

    <div id="animationArea" onclick="toggleAnimation()">
        <div id="logoText"></div>
        <div id="movingBox"></div>
        <div id="extra1" class="extra-element" style="top: 350px; left: 100px;"></div>
        <div id="extra2" class="extra-element" style="top: 80px; left: 550px;"></div>
    </div>

    <script>
        let isRunning = false;
        let animationFrameId;
        let frameCounter = 0;

        const fullText = "Інженерія програмного забезпечення";
        let charIndex = 0;
        let isDeleting = false;

        let boxX = 150;
        let boxY = 150;
        let speedX = 3;
        let speedY = 3;
        
        let boxSize = 50;
        let sizeChange = 0.5;

        function animate() {
            if (!isRunning) return;

            frameCounter++;

            if (frameCounter % 3 === 0) {
                if (!isDeleting) {
                    charIndex++;
                    if (charIndex > fullText.length + 30) { 
                        isDeleting = true;
                    }
                } else {
                    charIndex--;
                    if (charIndex <= 0) {
                        isDeleting = false; 
                    }
                }
                
                let safeIndex = Math.max(0, Math.min(charIndex, fullText.length));
                document.getElementById("logoText").innerText = fullText.substring(0, safeIndex);
            }

            let box = document.getElementById("movingBox");
            
            boxX += speedX;
            boxY += speedY;

            boxSize += sizeChange;
            if (boxSize > 120 || boxSize < 40) {
                sizeChange = -sizeChange; 
            }

            let hitWall = false;
            if (boxX + boxSize > 700 || boxX < 0) {
                speedX = -speedX;
                hitWall = true;
            }
            if (boxY + boxSize > 450 || boxY < 0) {
                speedY = -speedY;
                hitWall = true;
            }

            if (hitWall) {
                changeBoxProperties(box);
            }

            box.style.left = boxX + "px";
            box.style.top = boxY + "px";
            box.style.width = boxSize + "px";
            box.style.height = boxSize + "px";

            let extra1 = document.getElementById("extra1");
            let extra2 = document.getElementById("extra2");
            
            if (frameCounter % 240 < 120) {
                extra1.style.display = "block";
                extra2.style.display = "none";
            } else {
                extra1.style.display = "none";
                extra2.style.display = "block";
            }

            animationFrameId = requestAnimationFrame(animate);
        }

        function changeBoxProperties(element) {
            let r = Math.floor(Math.random() * 200);
            let g = Math.floor(Math.random() * 200);
            let b = Math.floor(Math.random() * 200);
            
            element.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
            element.style.borderRadius = (Math.random() > 0.5) ? "50%" : "0%";
        }

        function toggleAnimation() {
            isRunning = !isRunning;
            if (isRunning) {
                animate();
            } else {
                cancelAnimationFrame(animationFrameId);
            }
        }
    </script>
</body>
</html>
