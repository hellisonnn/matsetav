<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 4 - Перегляд зображень</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }

        .gallery-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 420px;
        }

        .gallery-container h3 {
            margin-top: 0;
            color: #333;
        }

        #gallery-img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 5px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #008CBA;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #005f7f;
        }
    </style>
</head>
<body>
    <a style="display: block; text-align: right;" href="lab3.html">Назад</a>
    <div class="gallery-container">
        <h3>Галерея зображень</h3>
        
        <img id="gallery-img" src="" alt="Зображення галереї">
        
        <div class="controls">
            <button id="btn-prev">« Назад</button>
            <button id="btn-next">Вперед »</button>
        </div>
    </div>

    <script>
        const jsonImages = '["https://picsum.photos/id/1015/400/250", "https://picsum.photos/id/1016/400/250", "https://picsum.photos/id/1018/400/250", "https://picsum.photos/id/1019/400/250"]';
        
        const images = JSON.parse(jsonImages);
        
        let currentIndex = 0;
        const imgElement = document.getElementById('gallery-img');
        
        imgElement.src = images[currentIndex];

        document.getElementById('btn-next').addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % images.length;
            imgElement.src = images[currentIndex];
        });

        document.getElementById('btn-prev').addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            imgElement.src = images[currentIndex];
        });
    </script>
</body>
</html>
