<!DOCTYPE html>
<html lang="uk">

    <title>Лабораторна робота №1</title>
    <script language="JavaScript">
        function calculation() {
            let x = 12;
            let y = 5;
            let result = (1 - Math.pow(x, 2)) / Math.pow(y, 3);

        function handleEvent(message) {

<body>
    <a style="display: block; text-align: right;" href="lab1.html">Назад</a>
