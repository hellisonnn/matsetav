<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №1</title>
    <script language="JavaScript">
        function calculation() {
            let x = 12;
            let y = 5;
            let result = (1 - Math.pow(x, 2)) / Math.pow(y, 3);
            alert(result);
        }

        function handleEvent(message) {
            document.getElementById('task3_result').value = message;
        }

        function calculateTask4() {
            let x = parseFloat(document.getElementById('task4_x').value);
            let y = parseFloat(document.getElementById('task4_y').value);
            let f;

            if ((x < 10) || (y > 3)) {
                f = Math.pow(x, 2) + Math.pow(y, 2);
            } else if (x > 2) {
                f = x - y + Math.pow(x, 2);
            } else {
                f = Math.pow(x, 3) + 3 * x * y;
            }

            document.getElementById('task4_result').value = f;
        }

        function calculateTask5() {
            let x = parseFloat(document.getElementById('task5_x').value);
            let y = parseFloat(document.getElementById('task5_y').value);
            let sum = 0.0;

            function getFactorial(n) {
                let res = 1;
                for(let j = 1; j <= n; j++) {
                    res *= j;
                }
                return res;
            }

            for (let i = 7; i <= 11; i++) {
                let sign = Math.pow(-1, i);
                let numerator = x + y - getFactorial(i);
                let denominator = getFactorial(i - 1);
                
                sum += sign * (numerator / denominator);
            }

            document.getElementById('task5_result').value = sum;
        }
    </script>
</head>
<body>
