<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input[type="number"] {
            padding: 5px;
            margin-top: 5px;
            width: 100px;
            margin-right: 10px;
        }
        button {
            padding: 7px 15px;
            cursor: pointer;
            background-color: #6f42c1;
            color: white;
            border: none;
            border-radius: 4px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #59339d;
        }
        #result5 {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #383d41;
            background-color: #e2e3e5;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #d6d8db;
            display: none;
        }
    </style>
</head>
<body>
    <a style="display: block; text-align: right;" href="lab7.html">Назад</a>
    <h2>Завдання 5: Статичний метод</h2>

    <div class="form-group">
        <label for="inputA">Введіть число a:</label><br>
        <input type="number" id="inputA" value="5">
    </div>

    <div class="form-group">
        <label for="inputB">Введіть число b:</label><br>
        <input type="number" id="inputB" value="7">
    </div>
    
    <button onclick="displaySum()">Додати числа</button>

    <div id="result5"></div>

    <script>
        class MathHelper {
            static add(a, b) {
                return a + b;
            }
        }

        function displaySum() {
            let a = parseFloat(document.getElementById("inputA").value);
            let b = parseFloat(document.getElementById("inputB").value);
            let resultDiv = document.getElementById("result5");

            if (isNaN(a) || isNaN(b)) {
                resultDiv.style.color = "red";
                resultDiv.innerText = "Помилка: введіть коректні числа!";
                resultDiv.style.display = "block";
                return;
            }

            let sum = MathHelper.add(a, b);

            resultDiv.style.color = "#383d41";
            resultDiv.innerText = `Результат додавання (${a} + ${b}): ${sum}`;
            resultDiv.style.display = "block";
        }
    </script>

</body>
</html>
